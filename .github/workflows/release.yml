# What happens after a release is published.
#
# Not the release itself: that is still `./scripts/make-dmg.sh` on a Mac, and it
# has to be. The DMG is signed with an identity that lives in a local keychain,
# and macOS keys Input Monitoring and Accessibility to that signature — a runner
# rebuilding the app would produce a different one, and every user would have to
# grant both permissions again on every release.
#
# What CI can own is everything downstream of the published asset: read the
# version, fetch the DMG GitHub is actually serving, checksum that, and open a
# pull request against the Homebrew tap. The work is in scripts/update-cask.sh
# so it can be run and debugged on a Mac rather than only by pushing tags.
#
# ── The secret this needs ────────────────────────────────────────────────────
# Name:        TAP_TOKEN
# Kind:        fine-grained personal access token (Settings → Developer settings
#              → Personal access tokens → Fine-grained tokens)
# Resource:    only the repository i4erkasov/homebrew-m14t-touch
# Permissions: Contents: Read and write     (to push the branch)
#              Pull requests: Read and write (to open the PR)
#              nothing else — no Actions, no Administration, no other repository
# Added at:    github.com/i4erkasov/m14t-touch-macos → Settings → Secrets and
#              variables → Actions → New repository secret
#
# The built-in GITHUB_TOKEN cannot be used: it is scoped to this repository and
# the tap is a different one.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to push to the tap, e.g. v1.0.4"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cask-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAP_REPO: i4erkasov/homebrew-m14t-touch
  CASK_PATH: Casks/m14t-touch.rb

jobs:
  cask:
    name: Update the Homebrew cask
    runs-on: ubuntu-latest
    steps:
      - name: Fail now if the token is missing
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            {
              echo "### The cask was not updated"
              echo
              echo "The secret \`TAP_TOKEN\` is not set on this repository, so this"
              echo "workflow cannot push a branch to \`$TAP_REPO\`."
              echo
              echo "Create a **fine-grained** personal access token scoped to"
              echo "\`$TAP_REPO\` alone, with **Contents: Read and write** and"
              echo "**Pull requests: Read and write**, and add it under"
              echo "Settings → Secrets and variables → Actions as \`TAP_TOKEN\`."
              echo
              echo "Then re-run this workflow, or run it by hand from the Actions"
              echo "tab with the release tag."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=TAP_TOKEN missing::Add a fine-grained PAT named TAP_TOKEN (Contents + Pull requests, write, on $TAP_REPO). See the job summary."
            exit 1
          fi

      - name: Work out which release this is
        id: release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "::error::No tag: this ran neither from a published release nor with an input."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Release $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out this repository, for the scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Point the cask at the release
        id: cask
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/update-cask.sh "$TAG" "$GITHUB_WORKSPACE/tap" | tee /tmp/update.log
          grep -q '^changed=yes$' /tmp/update.log && changed=yes || changed=no
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Say so and stop, if there was nothing to change
        if: steps.cask.outputs.changed != 'yes'
        run: |
          echo "The cask already describes this release; no pull request opened." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request against the tap
        if: steps.cask.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd tap
          branch="cask/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "m14t-touch $VERSION"
          git push --force origin "$branch"

          # A pull request, never a push to main: the checksum gets a human's
          # eye before anyone's `brew upgrade` starts trusting it.
          {
            echo "[Release $TAG](https://github.com/${{ github.repository }}/releases/tag/$TAG) is published."
            echo
            echo "The version and checksum were taken from the asset GitHub is serving,"
            echo "downloaded by this workflow — not from a local build."
            echo
            echo '```diff'
            git --no-pager diff HEAD~1 -- "$CASK_PATH" | grep -E '^[-+][^-+]' || true
            echo '```'
            echo
            echo "Before merging: \`brew audit --cask --strict --online m14t-touch\` and \`brew style\`."
          } > /tmp/pr-body.md

          if gh pr view "$branch" --repo "$TAP_REPO" >/dev/null 2>&1; then
            echo "Updated the existing pull request for \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --repo "$TAP_REPO" --base main --head "$branch" \
                    --title "m14t-touch $VERSION" --body-file /tmp/pr-body.md)
            echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
          fi
