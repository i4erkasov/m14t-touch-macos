# What happens after a release is published.
#
# Not the release itself: that is still `./scripts/make-dmg.sh` on a Mac, and it
# has to be. The DMG is signed with an identity that lives in a local keychain,
# so a runner rebuilding it would produce a different signature — and macOS keys
# Input Monitoring and Accessibility to the signature, meaning every user would
# have to grant both permissions again on every release. CI cannot do that part
# without a Developer ID certificate to sign with.
#
# What CI can own is everything downstream of the published asset. Today that is
# the Homebrew cask: read the version, fetch the DMG GitHub is actually serving,
# checksum it, and open a pull request against the tap. The checksum is never
# copied from a local build, which is the point — it describes the file users
# will download, not the one that happened to be on the developer's disk.
#
# Requires a secret, TAP_TOKEN: a fine-grained personal access token with
# Contents: read and write and Pull requests: read and write on
# i4erkasov/homebrew-m14t-touch. The built-in GITHUB_TOKEN cannot reach another
# repository.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to push to the tap, e.g. v1.0.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cask-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAP_REPO: i4erkasov/homebrew-m14t-touch
  CASK_PATH: Casks/m14t-touch.rb

jobs:
  cask:
    name: Update the Homebrew cask
    runs-on: ubuntu-latest
    steps:
      - name: Check the token is there
        run: |
          if [ -z "${{ secrets.TAP_TOKEN }}" ]; then
            echo "::error::TAP_TOKEN is not set. Create a fine-grained PAT with" \
                 "Contents and Pull requests write access on $TAP_REPO and add it" \
                 "as a repository secret named TAP_TOKEN."
            exit 1
          fi

      - name: Work out the version and the asset
        id: release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::tag '$TAG' is not of the form vX.Y.Z"; exit 1 ;;
          esac
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "asset=M14t-Touch-$TAG.dmg"
          } >> "$GITHUB_OUTPUT"

      - name: Download the published DMG and check its SHA-256
        id: asset
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/$ASSET"
          echo "Fetching $url"
          # --fail so an HTML 404 page never gets checksummed as if it were a DMG.
          curl --fail --silent --show-error --location --retry 3 --output "$ASSET" "$url"
          file "$ASSET"
          sha="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          bytes="$(stat -c%s "$ASSET")"
          if [ "$bytes" -lt 100000 ]; then
            echo "::error::$ASSET is only $bytes bytes — that is not the disk image"
            exit 1
          fi
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "$ASSET: $bytes bytes, sha256 $sha"

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Write the new version into the cask
        id: edit
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd tap
          python3 - <<'PY'
          import os, re, sys

          path = os.environ["CASK_PATH"]
          version, sha = os.environ["VERSION"], os.environ["SHA256"]
          text = original = open(path, encoding="utf-8").read()

          text, n = re.subn(r'^(\s*version\s+)"[^"]*"', rf'\g<1>"{version}"',
                            text, count=1, flags=re.M)
          if n != 1:
              sys.exit(f"no version stanza in {path}")
          text, n = re.subn(r'^(\s*sha256\s+)"[^"]*"', rf'\g<1>"{sha}"',
                            text, count=1, flags=re.M)
          if n != 1:
              sys.exit(f"no sha256 stanza in {path}")

          if text == original:
              print("changed=no")
          else:
              open(path, "w", encoding="utf-8").write(text)
              print("changed=yes")
          PY
          if git diff --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "The cask already says $VERSION with this checksum — nothing to do."
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            git diff
          fi

      - name: Open a pull request against the tap
        if: steps.edit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd tap
          branch="cask/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "m14t-touch $VERSION"
          git push --force origin "$branch"

          # Nothing is pushed to main: the checksum and the release notes get a
          # human's eye before anyone's `brew upgrade` starts trusting them.
          if gh pr view "$branch" --repo "$TAP_REPO" >/dev/null 2>&1; then
            echo "A pull request for $branch is already open; the branch was updated."
          else
            gh pr create --repo "$TAP_REPO" \
              --base main --head "$branch" \
              --title "m14t-touch $VERSION" \
              --body "$(printf '%s\n' \
                "[Release $TAG](https://github.com/${{ github.repository }}/releases/tag/$TAG) is published." \
                "" \
                "- version: \`$VERSION\`" \
                "- sha256: \`$SHA256\`" \
                "" \
                "The checksum is of the asset GitHub is serving, downloaded by this workflow — not of a local build." \
                "" \
                "Before merging: \`brew audit --cask --strict --online m14t-touch\` and \`brew style\`.")"
          fi
